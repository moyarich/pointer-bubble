name: Move playground components

on:
  push:
    branches: [refactor/playground-components]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/playground-components
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Move playground modules under components
        run: |
          mv apps/playground/src/playground/* apps/playground/src/components/
          rmdir apps/playground/src/playground

          python - <<'PY'
          from pathlib import Path

          roots = [
              Path('apps/playground/src'),
              Path('apps/playground/examples'),
              Path('docs'),
          ]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.css', '.md', '.json'}

          replacements = {
              './playground/': './components/',
              '../playground/': '../components/',
              '@/playground/': '@/components/',
              'apps/playground/src/playground/': 'apps/playground/src/components/',
              'src/playground/': 'src/components/',
          }

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in extensions:
                      continue
                  text = path.read_text()
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated)
          PY

          if grep -R "src/playground\|@/playground\|\./playground/\|\.\./playground/" apps/playground/src apps/playground/examples docs --exclude-dir=node_modules; then
            echo "Found stale playground path references"
            exit 1
          fi
      - name: Validate
        run: npm run build:playground
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/playground/src apps/playground/examples docs/README-dev.md
          git diff --cached --quiet && exit 0
          git commit -m "Move playground modules under components"
          git push
