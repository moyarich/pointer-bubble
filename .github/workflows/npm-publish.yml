name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (must match package.json)
        required: true
        default: 0.1.1
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: string
      access:
        description: npm package access
        required: true
        default: public
        type: choice
        options:
          - public
          - restricted

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate publish version
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/pointer-bubble/package.json').version")"
          if [ "$PACKAGE_VERSION" != "$PUBLISH_VERSION" ]; then
            echo "Requested version $PUBLISH_VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi
      - name: Publish package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.tag }}
          NPM_ACCESS: ${{ inputs.access }}
        run: npm run publish:lib
