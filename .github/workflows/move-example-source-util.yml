name: Move example source utility

on:
  push:
    branches: [refactor/find-example-source-util]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/find-example-source-util
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Move and rename utility
        run: |
          mkdir -p apps/playground/src/utils
          mv apps/playground/src/playground/examples/exampleSource.ts apps/playground/src/utils/findExampleSource.ts
          python - <<'PY'
          from pathlib import Path

          targets = list(Path('apps/playground/src/playground/examples').glob('*.tsx'))
          targets += [Path('docs/README-dev.md'), Path('apps/playground/examples/README.md')]

          for path in targets:
              text = path.read_text()
              text = text.replace(
                  'import { exampleSource } from "./exampleSource";',
                  'import { findExampleSource } from "@/utils/findExampleSource";',
              )
              text = text.replace('exampleSource(', 'findExampleSource(')
              path.write_text(text)

          util = Path('apps/playground/src/utils/findExampleSource.ts')
          text = util.read_text()
          text = text.replace('../../../examples/**/*.tsx', '../../examples/**/*.tsx')
          text = text.replace('../../../examples/${path}.tsx', '../../examples/${path}.tsx')
          text = text.replace('export function exampleSource(', 'export function findExampleSource(')
          util.write_text(text)
          PY
      - name: Validate
        run: npm run build:playground
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/playground/src apps/playground/examples/README.md docs/README-dev.md
          git commit -m "Move example source loader to utils"
          git push
